# Lámina — vhost público (cloud-2). certbot (--nginx) agrega el bloque 443 y la redirección.
# La app envía CSP y HSTS; nginx no los duplica.
limit_req_zone $binary_remote_addr zone=lamina_auth:2m rate=20r/m;
limit_req_zone $binary_remote_addr zone=lamina_write:2m rate=60r/m;

server {
  server_name lamina.cupula.com.ec;
  server_tokens off;

  client_max_body_size 64m;
  client_body_timeout 60s;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  # La página de captura del renderer solo es alcanzable por la red interna de Docker.
  location ^~ /render/ { return 404; }

  location ^~ /api/auth/sign-in {
    limit_req zone=lamina_auth burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/lamina-proxy.conf;
  }

  location = /api/presentations {
    limit_req zone=lamina_write burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64m;
    proxy_request_buffering on;
    include /etc/nginx/snippets/lamina-proxy.conf;
  }

  location / {
    include /etc/nginx/snippets/lamina-proxy.conf;
  }
}
