name: CLA
on:
  issue_comment: { types: [created] }
  pull_request_target: { types: [opened, closed, synchronize] }
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant (Action)
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'He leído el CLA y acepto sus términos') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/cupula-ec/lamina/blob/main/CLA.md
          branch: cla-signatures
          allowlist: esteban-dcp,SirAmong,bot*
          custom-notsigned-prcomment: "Gracias por contribuir a Lámina. Antes de fusionar necesitamos que aceptes el [CLA](https://github.com/cupula-ec/lamina/blob/main/CLA.md): responde con el comentario exacto de abajo."
          custom-pr-sign-comment: "He leído el CLA y acepto sus términos"
